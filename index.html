<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad Parejas</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/jquery-3.6.0.js"></script>
    <script src="js/main.js"></script>
</head>

<body>
   <div class="container">

        <div class="actividad">

            <h2 class="text-center mb-5">
                Completa las parejas
            </h2>

            <div class="row">

                <div class="col-md-6">

                    <div class="pareja">
                     <img src="img/val.jpg" alt="" width="50px" height="50px">Val
                    </div>
   
                    <div class="pareja">
                        <img src="img/bill.jpg" alt="" width="50px" height="50px"> Bill
                    </div>

                    <div class="pareja">
                        <img src="img/riley.jpg" alt="" width="50px" height="50px">Riley
                    </div>

                </div>

          
                <div class="col-md-6">

                    <div class="mb-4">

                        <select class="form-select respuesta" data-correcta="Ladra">
                            <option value="">Seleccione</option>
                            <option>Riley</option>
                            <option>Bill</option>
                            <option>Val</option>
                        </select>

                    </div>

                    <div class="mb-4">

                        <select class="form-select respuesta" data-correcta="Maúlla">
                            <option value="">Seleccione</option>
                            <option>Riley</option>
                            <option>Bill</option>
                            <option>Val</option>
                        </select>

                    </div>

                    <div class="mb-4">

                        <select class="form-select respuesta" data-correcta="Salta">
                            <option value="">Seleccione</option>
                            <option>Reiley</option>
                            <option>Bill</option>
                            <option>Val</option>
                        </select>

                    </div>

                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-success" onclick="verificar()">
                    Verificar
                </button>

                <button class="btn btn-primary" onclick="reiniciar()">
                    Reiniciar
                </button>

            </div>

            <div id="resultado" class="resultado">

            </div>

        </div>

    </div>


    <audio id="audioBien" src="audios/success.mp3"></audio>
    <audio id="audioMal" src="audios/twin.mp3"></audio>
    <audio id="audioAplausos" src="audio/aplausos.mp3"></audio>






</body>

</html>
